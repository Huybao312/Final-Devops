name: Week 2 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: todo_test
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d todo_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.CI_DB_PASSWORD }}@127.0.0.1:5432/todo_test
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --build-arg APP_VERSION="$GITHUB_SHA" -t "todo-task-manager:$GITHUB_SHA" .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test real PostgreSQL CRUD and health
        run: python -m pytest -q tests

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, todo-vm]
    environment: production
    concurrency:
      group: todo-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy commit to UTM VM
        env:
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
          APP_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DB_ADMIN_PASSWORD"
          test -n "$DB_APP_PASSWORD"
          [[ "$DB_ADMIN_PASSWORD" =~ ^[A-Za-z0-9._~-]+$ ]]
          [[ "$DB_APP_PASSWORD" =~ ^[A-Za-z0-9._~-]+$ ]]
          docker compose build app
          docker compose up -d --wait
          test "$(curl -fsS http://127.0.0.1:5000/version | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "$GITHUB_SHA"
          curl -fsS http://127.0.0.1:5000/health
          echo "Deployed commit $GITHUB_SHA"
