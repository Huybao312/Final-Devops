name: todo-monitoring
services:
  node-exporter:
    image: prom/node-exporter:v1.10.2
    network_mode: host
    pid: host
    command: ['--path.rootfs=/host', '--web.listen-address=127.0.0.1:9100']
    volumes: ['/:/host:ro,rslave']
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    network_mode: host
    command: ['--config.file=/config/blackbox.yml', '--web.listen-address=127.0.0.1:9115']
    volumes: ['./blackbox.yml:/config/blackbox.yml:ro']
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--web.listen-address=127.0.0.1:9090', '--storage.tsdb.retention.time=7d']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
volumes:
  prometheus_data:
  grafana_data:
